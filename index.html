<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LimTé | Taiwanese Bubble Tea Explorer & Intake Analytics</title>
  <style>
    :root {
      --primary: #92400e;        /* Roasted tea amber */
      --primary-dark: #78350f;
      --primary-light: #fef3c7;
      --accent: #d97706;
      --bg: #faf9f6;             /* Warm modern off-white */
      --card-bg: #ffffff;
      --border: #e7e5e4;
      --text-main: #1c1917;
      --text-muted: #64748b;
      --radius: 14px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.07), 0 8px 10px -6px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2.5rem 1.25rem 5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .badge-tw {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.35rem 0.95rem;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
      letter-spacing: 0.02em;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 0.45rem;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Top Control Bar: Navigation Tabs & Currency Toggle */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .nav-tabs {
      display: flex;
      gap: 0.4rem;
      background: #edebe8;
      padding: 0.3rem;
      border-radius: 9999px;
      flex: 1;
      min-width: 320px;
    }

    .tab-btn {
      flex: 1;
      padding: 0.7rem 0.85rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    /* Currency Switcher Pill */
    .currency-switch {
      display: flex;
      align-items: center;
      background: #edebe8;
      padding: 0.3rem;
      border-radius: 9999px;
      gap: 0.25rem;
    }

    .curr-btn {
      border: none;
      background: transparent;
      padding: 0.5rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .curr-btn.active {
      background: var(--primary-dark);
      color: #ffffff;
      box-shadow: 0 2px 5px rgba(120, 53, 15, 0.25);
    }

    .view-panel { display: none; }
    .view-panel.active { display: block; }

    /* Menu Toolbar: Brand Chips & Live Search */
    .menu-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .brand-filter {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 0.4rem;
      flex: 1;
      min-width: 300px;
    }

    .brand-chip {
      padding: 0.55rem 1.15rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.86rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .brand-chip.active {
      background: var(--primary-dark);
      color: #ffffff;
      border-color: var(--primary-dark);
      box-shadow: 0 4px 10px rgba(120, 53, 15, 0.2);
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 290px;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.35rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.9rem;
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(146, 64, 14, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .menu-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-heading {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .menu-count {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Menu Cards Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.4rem;
    }

    .drink-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .drink-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      height: 175px;
      overflow: hidden;
      background: #e7e5e4;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .drink-card:hover .card-img-wrap img {
      transform: scale(1.05);
    }

    .card-category-badge {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      color: var(--primary-dark);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .card-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .drink-title-block {
      margin-bottom: 1rem;
    }

    .drink-name {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-main);
      margin-bottom: 0.35rem;
    }

    .drink-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--border);
      padding-top: 0.85rem;
      margin-top: auto;
    }

    .drink-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.01em;
    }

    .btn-log-pick {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #fde68a;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-log-pick:hover {
      background: #fde68a;
      transform: translateY(-1px);
    }

    /* Form Container */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.5rem;
    }

    .form-group { margin-bottom: 1.4rem; }
    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.45rem;
    }

    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 0.75rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 0.92rem;
      background: #ffffff;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(146, 64, 14, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 85px;
      line-height: 1.5;
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .radio-pill input { display: none; }
    .radio-pill span {
      display: inline-block;
      padding: 0.45rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      background: #ffffff;
      transition: all 0.15s ease;
    }

    .radio-pill input:checked + span {
      background: var(--primary-dark);
      color: #ffffff;
      border-color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(120, 53, 15, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 0.95rem;
      background: var(--primary-dark);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(120, 53, 15, 0.25);
    }

    .btn-submit:hover {
      background: #5c2707;
      transform: translateY(-1px);
    }

    /* Analytics Cards */
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.15rem;
      margin-bottom: 2.25rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem 1rem;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .stat-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin: 0.35rem 0 0.15rem;
    }

    /* History Log Items */
    .log-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.4rem;
      margin-bottom: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .log-details { flex: 1; }

    .log-details h4 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      color: var(--text-main);
    }

    .log-tags {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.4rem;
    }

    .log-tag {
      background: var(--bg);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: 500;
    }

    .log-comment {
      margin-top: 0.75rem;
      font-size: 0.88rem;
      color: #334155;
      background: #fafaf9;
      border-left: 3px solid var(--accent);
      padding: 0.55rem 0.85rem;
      border-radius: 4px;
      font-style: italic;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #dc2626;
      font-size: 0.86rem;
      cursor: pointer;
      font-weight: 700;
      padding-top: 0.25rem;
    }

    .btn-delete:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧋LimTé </h1>
      <p>Explore full English menus from Taiwan's signature bubble tea brands, toggle real-time NTD/USD exchange rates, and quantify intake habits.</p>
    </header>

    <!-- Top Controls: Views & Currency Switcher -->
    <div class="top-controls">
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchView('menuView')">Browse Menu</button>
        <button class="tab-btn" onclick="switchView('logView')">Log a Cup</button>
        <button class="tab-btn" onclick="switchView('analyticsView')">Intake Analytics</button>
      </div>

      <div class="currency-switch">
        <button class="curr-btn active" id="btnNTD" onclick="setCurrency('NTD')">NTD (NT$)</button>
        <button class="curr-btn" id="btnUSD" onclick="setCurrency('USD')">USD ($)</button>
      </div>
    </div>

    <!-- View 1: Menu Explorer -->
    <div id="menuView" class="view-panel active">
      <div class="menu-toolbar">
        <div class="brand-filter" id="brandFilter"></div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="menuSearchInput"
            placeholder="Search drinks or categories..."
            oninput="handleSearch(this.value)"
          />
        </div>
      </div>

      <div class="menu-header-bar">
        <h3 id="currentBrandTitle" class="brand-heading"></h3>
        <span class="menu-count" id="currentBrandCount"></span>
      </div>
      <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- View 2: Drink Logger -->
    <div id="logView" class="view-panel">
      <div class="card">
        <form id="drinkForm" onsubmit="handleFormSubmit(event)">
          <div class="form-group">
            <label>Brand Name</label>
            <input type="text" id="formBrand" required placeholder="e.g., Oolong Tea Project (得正), Milksha (迷客夏)" />
          </div>

          <div class="form-group">
            <label>Beverage Name</label>
            <input type="text" id="formDrink" required placeholder="e.g., Cheese Foam Spring Oolong, Honey Pearl Black Tea Latte" />
          </div>

          <div class="form-group">
            <label>Sweetness Level</label>
            <div class="options-row">
              <label class="radio-pill"><input type="radio" name="sugar" value="0%" checked /><span>Unsweetened 0%</span></label>
              <label class="radio-pill"><input type="radio" name="sugar" value="30%" /><span>Micro 30%</span></label>
              <label class="radio-pill"><input type="radio" name="sugar" value="50%" /><span>Half 50%</span></label>
              <label class="radio-pill"><input type="radio" name="sugar" value="70%" /><span>Less 70%</span></label>
              <label class="radio-pill"><input type="radio" name="sugar" value="100%" /><span>Regular 100%</span></label>
            </div>
          </div>

          <div class="form-group">
            <label>Ice Level</label>
            <div class="options-row">
              <label class="radio-pill"><input type="radio" name="ice" value="No Ice" checked /><span>No Ice</span></label>
              <label class="radio-pill"><input type="radio" name="ice" value="Micro Ice" /><span>Micro Ice</span></label>
              <label class="radio-pill"><input type="radio" name="ice" value="Less Ice" /><span>Less Ice</span></label>
              <label class="radio-pill"><input type="radio" name="ice" value="Regular Ice" /><span>Regular Ice</span></label>
              <label class="radio-pill"><input type="radio" name="ice" value="Warm / Hot" /><span>Warm / Hot</span></label>
            </div>
          </div>

          <div class="form-group">
            <label>Add-ons & Toppings</label>
            <input type="text" id="formToppings" placeholder="e.g., Honey Pearls, Oolong Jelly, Grass Jelly (optional)" />
          </div>

          <div class="form-group">
            <label id="formPriceLabel">Price in NTD (NT$)</label>
            <input type="number" id="formPrice" required min="0" step="any" placeholder="60" />
          </div>

          <div class="form-group">
            <label>Flavor Rating</label>
            <select id="formRating">
              <option value="5">⭐⭐⭐⭐⭐ Outstanding &bull; Repeat Order</option>
              <option value="4" selected>⭐⭐⭐⭐ Solid &bull; Recommended</option>
              <option value="3">⭐⭐⭐ Neutral &bull; Average</option>
              <option value="2">⭐⭐ Mediocre &bull; Unlikely Repeat</option>
              <option value="1">⭐ Disappointing</option>
            </select>
          </div>

          <div class="form-group">
            <label>Tasting Notes & Comments (Optional)</label>
            <textarea id="formComment" placeholder="e.g., Silky foam on crisp oolong, fragrant aroma with balanced sweetness..."></textarea>
          </div>

          <button type="submit" class="btn-submit">Save Intake Entry</button>
        </form>
      </div>
    </div>

    <!-- View 3: Analytics Dashboard -->
    <div id="analyticsView" class="view-panel">
      <div class="analytics-grid">
        <div class="stat-card">
          <div class="stat-label">Total Cups Logged</div>
          <div class="stat-value" id="statCups">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" id="statSpendLabel">Total Spending</div>
          <div class="stat-value" id="statSpending">NT$ 0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg Sweetness</div>
          <div class="stat-value" id="statAvgSugar">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Favorite Brand</div>
          <div class="stat-value" id="statTopBrand" style="font-size: 1.15rem;">None</div>
        </div>
      </div>

      <h3 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 1.1rem; color: var(--text-main);">Consumption History</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    // Global State for Currency (1 USD = 32 NTD)
    let currentCurrency = 'NTD';
    const FX_RATE = 32.0;

    function formatPrice(ntd) {
      if (currentCurrency === 'USD') {
        const usd = (ntd / FX_RATE).toFixed(2);
        return `$${usd} USD`;
      }
      return `NT$ ${ntd}`;
    }

    function setCurrency(currency) {
      currentCurrency = currency;
      document.getElementById('btnNTD').classList.toggle('active', currency === 'NTD');
      document.getElementById('btnUSD').classList.toggle('active', currency === 'USD');

      document.getElementById('formPriceLabel').innerText = currency === 'NTD'
        ? 'Price in NTD (NT$)'
        : 'Price in USD ($)';

      renderMenu();
      renderAnalytics();
    }

    // Complete Database of all 4 brands with 57 individually distinct photos
    const menuDatabase = [
      {
        brand: "Oolong Tea Project (得正)",
        drinks: [
          { name: "Spring Oolong Tea (春烏龍)", category: "Pure Brewed Oolong", price: 35, cal: 0, img: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=600&auto=format&fit=crop&q=80" },
          { name: "Roasted Oolong Tea (焙烏龍)", category: "Pure Brewed Oolong", price: 35, cal: 0, img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600&auto=format&fit=crop&q=80" },
          { name: "Golden Oolong Tea (金烏龍)", category: "Pure Brewed Oolong", price: 35, cal: 0, img: "https://images.unsplash.com/photo-1513442543410-bb9139fa027a?w=600&auto=format&fit=crop&q=80" },
          { name: "Cheese Foam Spring Oolong (芝士奶蓋春烏龍)", category: "Cheese Foam Series", price: 60, cal: 260, img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=600&auto=format&fit=crop&q=80" },
          { name: "Cheese Foam Roasted Oolong (芝士奶蓋焙烏龍)", category: "Cheese Foam Series", price: 60, cal: 260, img: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?w=600&auto=format&fit=crop&q=80" },
          { name: "Cheese Foam Golden Oolong (芝士奶蓋金烏龍)", category: "Cheese Foam Series", price: 60, cal: 260, img: "https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=600&auto=format&fit=crop&q=80" },
          { name: "Fresh Lemon Spring Oolong (檸檬春烏龍)", category: "Fruit Oolong Series", price: 55, cal: 170, img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=600&auto=format&fit=crop&q=80" },
          { name: "Sweet Orange Spring Oolong (香橙春烏龍)", category: "Fruit Oolong Series", price: 65, cal: 190, img: "https://images.unsplash.com/photo-1597481499750-3e6b22637e12?w=600&auto=format&fit=crop&q=80" },

    let selectedBrandIndex = -1; // -1 represents "All Brands"
    let currentSearchTerm = "";

    function renderBrands() {
      const container = document.getElementById("brandFilter");
      container.innerHTML = "";

      // "All Brands" chip
      const allChip = document.createElement("button");
      allChip.className = `brand-chip ${selectedBrandIndex === -1 ? "active" : ""}`;
      allChip.innerText = "All Brands (全部品牌)";
      allChip.onclick = () => {
        selectedBrandIndex = -1;
        renderBrands();
        renderMenu();
      };
      container.appendChild(allChip);

      // Render every brand using its whole character name
      menuDatabase.forEach((item, idx) => {
        const chip = document.createElement("button");
        chip.className = `brand-chip ${idx === selectedBrandIndex ? "active" : ""}`;
        chip.innerText = item.brand; // Full character brand name
        chip.onclick = () => {
          selectedBrandIndex = idx;
          renderBrands();
          renderMenu();
        };
        container.appendChild(chip);
      });
    }

    function handleSearch(query) {
      currentSearchTerm = query.trim().toLowerCase();
      renderMenu();
    }

    function renderMenu() {
      const grid = document.getElementById("menuGrid");
      grid.innerHTML = "";

      let candidateDrinks = [];
      if (selectedBrandIndex === -1) {
        menuDatabase.forEach(b => {
          b.drinks.forEach(d => {
            candidateDrinks.push({ ...d, brandName: b.brand });
          });
        });
        document.getElementById("currentBrandTitle").innerText = "All Brand Menus (全部品牌菜單)";
      } else {
        const currentBrand = menuDatabase[selectedBrandIndex];
        candidateDrinks = currentBrand.drinks.map(d => ({ ...d, brandName: currentBrand.brand }));
        document.getElementById("currentBrandTitle").innerText = currentBrand.brand;
      }

      if (currentSearchTerm !== "") {
        candidateDrinks = candidateDrinks.filter(d =>
          d.name.toLowerCase().includes(currentSearchTerm) ||
          d.category.toLowerCase().includes(currentSearchTerm) ||
          d.brandName.toLowerCase().includes(currentSearchTerm)
        );
      }

      document.getElementById("currentBrandCount").innerText = `${candidateDrinks.length} Items Found`;

      if (candidateDrinks.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 3.5rem 1rem; color: var(--text-muted);">
            <p style="font-size: 1.15rem; font-weight: 700; color: var(--text-main);">No matching drinks found.</p>
            <p style="font-size: 0.9rem; margin-top: 0.35rem;">Try searching for "Oolong", "Boba", "Latte", or "Jelly".</p>
          </div>
        `;
        return;
      }

      candidateDrinks.forEach(drink => {
        const card = document.createElement("div");
        card.className = "drink-card";

        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${drink.img}" alt="${drink.name}" loading="lazy" />
            <span class="card-category-badge">${drink.category}</span>
          </div>
          <div class="card-content">
            <div class="drink-title-block">
              <div class="drink-name">${drink.name}</div>
              <div class="drink-meta">
                <span>📍 ${drink.brandName}</span> &bull; 
                <span>🔥 ~${drink.cal} kcal</span>
              </div>
            </div>
            <div class="card-footer">
              <span class="drink-price">${formatPrice(drink.price)}</span>
              <button class="btn-log-pick" onclick="selectForLog('${drink.brandName.replace(/'/g, "\\'")}', '${drink.name.replace(/'/g, "\\'")}', ${drink.price})">Quick Log &rarr;</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function selectForLog(brand, drinkName, ntdPrice) {
      document.getElementById("formBrand").value = brand;
      document.getElementById("formDrink").value = drinkName;
      // Populate price in current currency
      document.getElementById("formPrice").value = currentCurrency === 'USD'
        ? (ntdPrice / FX_RATE).toFixed(2)
        : ntdPrice;
      switchView("logView");
    }

    function switchView(viewId) {
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById(viewId).classList.add("active");

      const tabIndex = viewId === "menuView" ? 0 : viewId === "logView" ? 1 : 2;
      document.querySelectorAll(".tab-btn")[tabIndex].classList.add("active");

      if (viewId === "analyticsView") {
        renderAnalytics();
      }
    }

    function getLogs() {
      return JSON.parse(localStorage.getItem("limte_logs") || "[]");
    }

    function saveLogs(logs) {
      localStorage.setItem("limte_logs", JSON.stringify(logs));
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const logs = getLogs();
      const enteredPrice = parseFloat(document.getElementById("formPrice").value) || 0;
      
      // Store uniformly in NTD for accurate conversions
      const ntdPrice = currentCurrency === 'USD' ? Math.round(enteredPrice * FX_RATE) : enteredPrice;

      const newEntry = {
        id: Date.now(),
        brand: document.getElementById("formBrand").value,
        drink: document.getElementById("formDrink").value,
        sugar: document.querySelector('input[name="sugar"]:checked').value,
        ice: document.querySelector('input[name="ice"]:checked').value,
        toppings: document.getElementById("formToppings").value.trim() || "None",
        priceNTD: ntdPrice,
        rating: document.getElementById("formRating").value,
        comment: document.getElementById("formComment").value.trim(),
        date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" })
      };

      logs.unshift(newEntry);
      saveLogs(logs);
      alert("✅ Added to your intake records!");
      document.getElementById("drinkForm").reset();
      switchView("analyticsView");
    }

    function deleteLog(id) {
      if (confirm("Delete this intake record?")) {
        const logs = getLogs().filter(l => l.id !== id);
        saveLogs(logs);
        renderAnalytics();
      }
    }

    function renderAnalytics() {
      const logs = getLogs();
      document.getElementById("statCups").innerText = logs.length;

      const totalSpendNTD = logs.reduce((sum, l) => sum + (l.priceNTD || 0), 0);
      document.getElementById("statSpending").innerText = formatPrice(totalSpendNTD);
      document.getElementById("statSpendLabel").innerText = `Total Spending (${currentCurrency})`;

      if (logs.length > 0) {
        const sugarSum = logs.reduce((sum, l) => sum + parseInt(l.sugar), 0);
        document.getElementById("statAvgSugar").innerText = `${Math.round(sugarSum / logs.length)}%`;

        const brandCounts = {};
        logs.forEach(l => { brandCounts[l.brand] = (brandCounts[l.brand] || 0) + 1; });
        const topBrand = Object.keys(brandCounts).reduce((a, b) => brandCounts[a] > brandCounts[b] ? a : b);
        document.getElementById("statTopBrand").innerText = topBrand; // Full character name
      } else {
        document.getElementById("statAvgSugar").innerText = "0%";
        document.getElementById("statTopBrand").innerText = "None";
      }

      const historyContainer = document.getElementById("historyList");
      historyContainer.innerHTML = "";

      if (logs.length === 0) {
        historyContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 3rem 1rem;">No drinks logged yet. Explore the menu and log your first cup!</p>`;
        return;
      }

      logs.forEach(l => {
        const item = document.createElement("div");
        item.className = "log-item";
        item.innerHTML = `
          <div class="log-details">
            <h4>${l.drink} <span style="font-weight: 500; font-size: 0.88rem; color: var(--text-muted);">(${l.brand})</span></h4>
            <div class="log-tags">
              <span class="log-tag">💰 ${formatPrice(l.priceNTD)}</span>
              <span class="log-tag">🍬 ${l.sugar} Sugar</span>
              <span class="log-tag">🧊 ${l.ice}</span>
              <span class="log-tag">🧋 Toppings: ${l.toppings}</span>
              <span class="log-tag">⭐ ${l.rating}/5</span>
              <span class="log-tag">📅 ${l.date}</span>
            </div>
            ${l.comment ? `<div class="log-comment">“${l.comment}”</div>` : ''}
          </div>
          <button class="btn-delete" onclick="deleteLog(${l.id})">Delete</button>
        `;
        historyContainer.appendChild(item);
      });
    }

    window.onload = () => {
      renderBrands();
      renderMenu();
    };
  </script>
