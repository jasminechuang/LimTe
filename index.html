<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LimTé | Taiwanese Bubble Tea Explorer & Intake Analytics</title>
  <style>
    :root {
      --primary: #92400e;        /* Roasted tea amber */
      --primary-dark: #78350f;
      --primary-light: #fef3c7;
      --accent: #d97706;
      --bg: #fdfbf7;
      --card-bg: #ffffff;
      --border: #e7e5e4;
      --text-main: #1c1917;
      --text-muted: #78716c;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding: 2rem 1.25rem 4rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .badge-tw {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.3rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 0.6rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      background: #e7e5e4;
      padding: 0.35rem;
      border-radius: 9999px;
      margin-bottom: 2rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.7rem 0.5rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary-dark);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .view-panel { display: none; }
    .view-panel.active { display: block; }

    /* Brand Chips */
    .brand-filter {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .brand-chip {
      padding: 0.5rem 1.1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .brand-chip.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary-dark);
    }

    /* Category Subtitle */
    .menu-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .menu-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Menu Cards */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.1rem;
    }

    .drink-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .drink-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
    }

    .drink-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: #fffbeb;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.4rem;
      border: 1px solid #fef3c7;
    }

    .drink-name {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--text-main);
    }

    .drink-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .drink-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--border);
      padding-top: 0.75rem;
    }

    .drink-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
    }

    .btn-log-pick {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-log-pick:hover { background: #fde68a; }

    /* Form Styles */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .form-group { margin-bottom: 1.35rem; }
    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.45rem;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      background: #fafaf9;
      color: var(--text-main);
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .radio-pill input { display: none; }
    .radio-pill span {
      display: inline-block;
      padding: 0.45rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      background: #fafaf9;
      transition: all 0.2s;
    }

    .radio-pill input:checked + span {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary-dark);
    }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: var(--primary-dark);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover { background: #5c2707; }

    /* Analytics Cards */
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
    }

    .stat-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin: 0.35rem 0 0.15rem;
    }

    /* History Log */
    .log-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem 1.35rem;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .log-details h4 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .log-tags {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.35rem;
    }

    .log-tag {
      background: var(--bg);
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .btn-delete {
      background: none;
      border: none;
      color: #dc2626;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-delete:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-tw">🧋 Taiwanese Beverage IS & Analytics</div>
      <h1>LimTé (喝茶)</h1>
      <p>Comprehensive English menus for Taiwan's leading boba brands, customizable logging, and intake analytics.</p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchView('menuView')">Browse Menu</button>
      <button class="tab-btn" onclick="switchView('logView')">Log a Cup</button>
      <button class="tab-btn" onclick="switchView('analyticsView')">Intake Analytics</button>
    </div>

    <!-- View 1: Menu Explorer -->
    <div id="menuView" class="view-panel active">
      <div class="brand-filter" id="brandFilter"></div>
      <div class="menu-header-bar">
        <h3 id="currentBrandTitle" style="font-size: 1.15rem; font-weight: 700;"></h3>
        <span class="menu-count" id="currentBrandCount"></span>
      </div>
      <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- View 2: Drink Logger -->
    <div id="logView" class="view-panel">
      <div class="card">
        <form id="drinkForm" onsubmit="handleFormSubmit(event)">
          <div class="form-group">
            <label>Brand Name</label>
            <input type="text" id="formBrand" required placeholder="e.g., Oolong Tea Project, Milksha, 50 Lan" />
          </div>

          <div class="form-group">
            <label>Beverage Name</label>
            <input type="text" id="formDrink" required placeholder="e.g., Cheese Foam Spring Oolong, Honey Pearl Black Tea Latte" />
          </div>

          <div class="form-group">
            <label>Sweetness Level</label>
            <div class="options-row">
              <label class="radio-pill"><input type="radio" name="sugar" value="0%" checked /><span>Unsweetened 0%</span></label>
              <label class="radio-pill"><input type="radio" name="sugar" value="30%" /><span>Micro 30%</span></label>
              <label class="radio-pill"><input type="radio" name="sugar" value="50%" /><span>Half 50%</span></label>
              <label class="radio-pill"><input type="radio" name="sugar" value="70%" /><span>Less 70%</span></label>
              <label class="radio-pill"><input type="radio" name="sugar" value="100%" /><span>Regular 100%</span></label>
            </div>
          </div>

          <div class="form-group">
            <label>Ice Level</label>
            <div class="options-row">
              <label class="radio-pill"><input type="radio" name="ice" value="No Ice" checked /><span>No Ice</span></label>
              <label class="radio-pill"><input type="radio" name="ice" value="Micro Ice" /><span>Micro Ice</span></label>
              <label class="radio-pill"><input type="radio" name="ice" value="Less Ice" /><span>Less Ice</span></label>
              <label class="radio-pill"><input type="radio" name="ice" value="Regular Ice" /><span>Regular Ice</span></label>
              <label class="radio-pill"><input type="radio" name="ice" value="Warm / Hot" /><span>Warm / Hot</span></label>
            </div>
          </div>

          <div class="form-group">
            <label>Add-ons & Toppings</label>
            <input type="text" id="formToppings" placeholder="e.g., Honey Pearls, Oolong Jelly, Grass Jelly (optional)" />
          </div>

          <div class="form-group">
            <label>Price (NT$)</label>
            <input type="number" id="formPrice" required min="0" placeholder="60" />
          </div>

          <div class="form-group">
            <label>Flavor Rating</label>
            <select id="formRating">
              <option value="5">⭐⭐⭐⭐⭐ Outstanding &bull; Repeat Order</option>
              <option value="4" selected>⭐⭐⭐⭐ Solid &bull; Recommended</option>
              <option value="3">⭐⭐⭐ Neutral &bull; Average</option>
              <option value="2">⭐⭐ Mediocre &bull; Unlikely Repeat</option>
              <option value="1">⭐ Disappointing</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">Save Intake Entry</button>
        </form>
      </div>
    </div>

    <!-- View 3: Analytics Dashboard -->
    <div id="analyticsView" class="view-panel">
      <div class="analytics-grid">
        <div class="stat-card">
          <div class="stat-label">Total Cups</div>
          <div class="stat-value" id="statCups">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Spend (NT$)</div>
          <div class="stat-value" id="statSpending">$0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg Sweetness</div>
          <div class="stat-value" id="statAvgSugar">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Favorite Brand</div>
          <div class="stat-value" id="statTopBrand" style="font-size: 1.15rem;">None</div>
        </div>
      </div>

      <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem;">Consumption History</h3>
      <div id="historyList"></div>
    </div>
  </div>

        drinks: [

          { name: "Sun Moon Lake Ruby Black Tea 18 (日月潭紅玉)", category: "Wellness Pure Brews", price: 45, cal: 0 },
          { name: "Taiwan Alpine High Mountain Green (高山青茶)", category: "Wellness Pure Brews", price: 35, cal: 0 },

          { name: "Golden Yuzu Green Tea (黃金柚子綠茶)", category: "Fruit & Crisp Series", price: 60, cal: 200 },
          { name: "Winter Melon Lemon Tea (冬瓜檸檬)", category: "Fruit & Crisp Series", price: 50, cal: 180 },
          { name: "Charcoal Roasted Milk Tea (炭焙厚奶茶)", category: "Artisan Milk Tea", price: 55, cal: 370 },
          { name: "Buckwheat Fresh Milk Latte (蕎麥鮮奶茶)", category: "Fresh Milk Series", price: 70, cal: 220 },
          { name: "Ruby Black Tea Latte with Grass Jelly (紅玉拿鐵加草仔粿)", category: "Fresh Milk Series", price: 75, cal: 310 }
        ]
      }
    ];

    let selectedBrandIndex = 0;

    function renderBrands() {
      const container = document.getElementById("brandFilter");
      container.innerHTML = "";
      menuDatabase.forEach((item, idx) => {
        const chip = document.createElement("button");
        chip.className = `brand-chip ${idx === selectedBrandIndex ? "active" : ""}`;
        chip.innerText = item.brand;
        chip.onclick = () => {
          selectedBrandIndex = idx;
          renderBrands();
          renderMenu();
        };
        container.appendChild(chip);
      });
    }

    function renderMenu() {
      const grid = document.getElementById("menuGrid");
      grid.innerHTML = "";
      const currentBrand = menuDatabase[selectedBrandIndex];

      document.getElementById("currentBrandTitle").innerText = currentBrand.brand;
      document.getElementById("currentBrandCount").innerText = `${currentBrand.drinks.length} Items Available`;

      currentBrand.drinks.forEach(drink => {
        const card = document.createElement("div");
        card.className = "drink-card";
        card.innerHTML = `
          <div>
            <span class="drink-badge">${drink.category}</span>
            <div class="drink-name">${drink.name}</div>
            <div class="drink-meta">${currentBrand.brand.split(" ")[0]} &bull; ~${drink.cal} kcal</div>
          </div>
          <div class="drink-footer">
            <span class="drink-price">NT$ ${drink.price}</span>
            <button class="btn-log-pick" onclick="selectForLog('${currentBrand.brand.replace(/'/g, "\\'")}', '${drink.name.replace(/'/g, "\\'")}', ${drink.price})">Log This &rarr;</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function selectForLog(brand, drinkName, price) {
      document.getElementById("formBrand").value = brand;
      document.getElementById("formDrink").value = drinkName;
      document.getElementById("formPrice").value = price;
      switchView("logView");
    }

    function switchView(viewId) {
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById(viewId).classList.add("active");

      const tabIndex = viewId === "menuView" ? 0 : viewId === "logView" ? 1 : 2;
      document.querySelectorAll(".tab-btn")[tabIndex].classList.add("active");

      if (viewId === "analyticsView") {
        renderAnalytics();
      }
    }

    function getLogs() {
      return JSON.parse(localStorage.getItem("limte_logs") || "[]");
    }

    function saveLogs(logs) {
      localStorage.setItem("limte_logs", JSON.stringify(logs));
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const logs = getLogs();
      const newEntry = {
        id: Date.now(),
        brand: document.getElementById("formBrand").value,
        drink: document.getElementById("formDrink").value,
        sugar: document.querySelector('input[name="sugar"]:checked').value,
        ice: document.querySelector('input[name="ice"]:checked').value,
        toppings: document.getElementById("formToppings").value.trim() || "None",
        price: parseFloat(document.getElementById("formPrice").value) || 0,
        rating: document.getElementById("formRating").value,
        date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" })
      };

      logs.unshift(newEntry);
      saveLogs(logs);
      alert("✅ Added to your intake records!");
      document.getElementById("drinkForm").reset();
      switchView("analyticsView");
    }

    function deleteLog(id) {
      if (confirm("Delete this intake record?")) {
        const logs = getLogs().filter(l => l.id !== id);
        saveLogs(logs);
        renderAnalytics();
      }
    }

    function renderAnalytics() {
      const logs = getLogs();
      document.getElementById("statCups").innerText = logs.length;

      const totalSpend = logs.reduce((sum, l) => sum + l.price, 0);
      document.getElementById("statSpending").innerText = `$${totalSpend.toLocaleString()}`;

      if (logs.length > 0) {
        const sugarSum = logs.reduce((sum, l) => sum + parseInt(l.sugar), 0);
        document.getElementById("statAvgSugar").innerText = `${Math.round(sugarSum / logs.length)}%`;

        const brandCounts = {};
        logs.forEach(l => { brandCounts[l.brand] = (brandCounts[l.brand] || 0) + 1; });
        const topBrand = Object.keys(brandCounts).reduce((a, b) => brandCounts[a] > brandCounts[b] ? a : b);
        document.getElementById("statTopBrand").innerText = topBrand.split(" ")[0];
      } else {
        document.getElementById("statAvgSugar").innerText = "0%";
        document.getElementById("statTopBrand").innerText = "None";
      }

      const historyContainer = document.getElementById("historyList");
      historyContainer.innerHTML = "";

      if (logs.length === 0) {
        historyContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 2.5rem;">No drinks logged yet. Explore the menu and log your first cup!</p>`;
        return;
      }

      logs.forEach(l => {
        const item = document.createElement("div");
        item.className = "log-item";
        item.innerHTML = `
          <div class="log-details">
            <h4>${l.drink} <span style="font-weight: 500; font-size: 0.85rem; color: var(--text-muted);">(${l.brand})</span></h4>
            <div class="log-tags">
              <span class="log-tag">💰 NT$ ${l.price}</span>
              <span class="log-tag">🍬 ${l.sugar} Sugar</span>
              <span class="log-tag">🧊 ${l.ice}</span>
              <span class="log-tag">🧋 Toppings: ${l.toppings}</span>
              <span class="log-tag">⭐ ${l.rating}/5</span>
              <span class="log-tag">📅 ${l.date}</span>
            </div>
          </div>
          <button class="btn-delete" onclick="deleteLog(${l.id})">Delete</button>
        `;
        historyContainer.appendChild(item);
      });
    }

    window.onload = () => {
      renderBrands();
      renderMenu();
    };
  </script>
</body>
</html>
